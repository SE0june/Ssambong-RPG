<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쌈@뽕 검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  :root{ color-scheme: dark; }
  *{-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#141821;overflow:hidden;
    font-family:"Noto Sans KR",system-ui,sans-serif;color:#e9ecf3}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#141821}
  canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
  #ui{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(12,16,24,.5);padding:16px;box-sizing:border-box;overflow:auto}
  #ui[hidden]{display:none}
  .panel{width:100%;max-width:540px;background:#1b2130;border:2px solid #c9a45c;border-radius:6px;margin:auto;
    box-shadow:0 0 0 4px #10141d,0 18px 40px rgba(0,0,0,.5);padding:22px 22px 18px;box-sizing:border-box}
  .eyebrow{font-size:12px;letter-spacing:.14em;color:#c9a45c;font-weight:700}
  .panel h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:48px;line-height:1.05;
    margin:6px 0 10px;color:#fff;text-shadow:3px 3px 0 #1f2230,-2px -2px 0 #1f2230,2px -2px 0 #1f2230,-2px 2px 0 #1f2230;text-wrap:balance}
  .panel p{margin:0 0 12px;line-height:1.6;color:#b9c1d3;font-size:14px}
  .label{font-size:11px;letter-spacing:.12em;color:#8f9ab2;font-weight:700;margin:0 0 6px}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px;padding:0;list-style:none;font-size:13px}
  .keys li{display:flex;align-items:center;gap:8px;background:#232b3d;border:1px solid #2f3a52;border-radius:4px;padding:6px 9px}
  .keys li.wide{grid-column:1/-1}
  kbd{font-family:"Black Han Sans",sans-serif;font-size:13px;min-width:24px;text-align:center;padding:2px 6px;
    background:#c9a45c;color:#1b2130;border-radius:3px;box-shadow:0 2px 0 #7d6331}
  .classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:0 0 12px}
  .cls{font-family:"Noto Sans KR",sans-serif;text-align:left;background:#232b3d;border:2px solid #2f3a52;border-radius:5px;color:#e9ecf3;
    padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.45}
  .cls b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:22px;color:#fff}
  .cls span{color:#9aa4ba}
  .cls[aria-pressed="true"]{border-color:#e0aa3e;background:#33304a}
  .cls:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin:0 0 12px}
  .st{font-family:"Noto Sans KR",sans-serif;background:#232b3d;border:2px solid #2f3a52;border-radius:4px;color:#e9ecf3;
    padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;line-height:1.2}
  .st b{font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:18px;color:#ffd35c}
  .st[aria-pressed="true"]{border-color:#e0aa3e;background:#33304a}
  .st:disabled{opacity:.4;cursor:not-allowed}
  .st:disabled b{color:#7f8aa3}
  .st:focus-visible{outline:3px solid #fff;outline-offset:1px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
  .stats div{background:#232b3d;border:1px solid #2f3a52;border-radius:4px;padding:8px;text-align:center;font-size:12px;color:#9aa4ba}
  .stats b{display:block;font-family:"Black Han Sans",sans-serif;font-weight:400;font-size:22px;color:#fff;font-variant-numeric:tabular-nums}
  .rank{font-family:"Black Han Sans",sans-serif;font-size:64px;color:#ffd35c;line-height:1;text-shadow:3px 3px 0 #1f2230}
  .row{display:flex;gap:8px}
  .btn{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:21px;width:100%;padding:11px;border:2px solid #1f2230;
    background:#e0aa3e;color:#1f2230;border-radius:4px;cursor:pointer;box-shadow:0 4px 0 #8a6421}
  .btn:hover{background:#f0bd52}
  .btn.ghost{background:#2c3448;color:#e9ecf3;box-shadow:0 4px 0 #151a26;width:auto;padding-inline:14px;font-size:15px}
  .btn.ghost:hover{background:#38415a}
  .btn.ghost{white-space:nowrap;flex:none}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8a6421}
  small{display:block;margin-top:12px;color:#7f8aa3;font-size:12px;line-height:1.5}
  .btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
  .cls:disabled{opacity:.5;cursor:not-allowed}
  .unlock{background:#3a2350;border:2px solid #b57bff;border-radius:6px;padding:10px 12px;color:#f0e0ff !important}
  #title{position:fixed;inset:0;background:#0f1320;overflow:hidden}
  #title[hidden]{display:none}
  #mapc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  .t-head{position:absolute;left:24px;top:16px;pointer-events:none}
  .t-head h1{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:54px;line-height:1;margin:4px 0 0;color:#fff;
    text-shadow:4px 4px 0 #1f2230,-3px -3px 0 #1f2230,3px -3px 0 #1f2230,-3px 3px 0 #1f2230,0 8px 18px rgba(0,0,0,.45)}
  .t-head .eyebrow{text-shadow:2px 2px 0 #1f2230}
  .t-tabs{position:absolute;left:24px;top:100px;display:flex;gap:8px;flex-wrap:wrap}
  .tab{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-size:18px;padding:7px 14px 8px;border:2px solid #1f2230;border-radius:6px;
    background:#2c3448;color:#e9ecf3;box-shadow:0 4px 0 #151a26;cursor:pointer;text-align:left;line-height:1.1}
  .tab .sub{display:block;font-family:"Noto Sans KR",sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;opacity:.75}
  .tab[aria-pressed="true"]{background:#e0aa3e;color:#1f2230;box-shadow:0 4px 0 #8a6421}
  .tab.locked:not([aria-pressed="true"]){background:#2a2238;color:#b8a8d0}
  .tab:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .t-side{position:absolute;right:16px;top:16px;bottom:16px;width:370px;max-width:none;margin:0;overflow:auto}
  .stagecard{background:#232b3d;border:1px solid #2f3a52;border-radius:6px;padding:12px 14px;margin:0 0 12px}
  .stagecard h2{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:30px;margin:4px 0 6px;color:#fff}
  .stagecard p{margin:0 0 4px;color:#b9c1d3;font-size:13px;line-height:1.55}
  .stagecard .boss b{color:#ff9a8a}
  .tab.ach{background:#3a2c18;color:#ffd35c}
  .forms{display:flex;gap:6px;margin:0 0 12px}
  .form{flex:1;font-family:"Noto Sans KR",sans-serif;font-size:11px;font-weight:700;padding:7px 9px;border:2px solid #2f3a52;border-radius:5px;background:#232b3d;color:#9aa4ba;cursor:pointer;text-align:left;line-height:1.35}
  .form b{display:block;font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:400;font-size:17px;color:#fff}
  .form[aria-pressed="true"]{border-color:#e0aa3e;background:#33304a}
  .form.fire[aria-pressed="true"]{border-color:#ff8a3a;background:#3a2420}
  .form.star[aria-pressed="true"]{border-color:#7ab8ff;background:#1e2a52}
  .form.void[aria-pressed="true"]{border-color:#c88aff;background:#2a1a44}
  .form.dusk[aria-pressed="true"]{border-color:#ff8a7a;background:linear-gradient(135deg,#232a5c,#5a2a4e 60%,#7a3a3a)}
  .forms{flex-wrap:wrap}.forms .form{min-width:30%}
  .tab.dg{background:#2a1a3a;color:#e0c4ff}
  .tab.dg[aria-pressed="true"]{background:#b57bff;color:#1a0e2a;box-shadow:0 4px 0 #5a2fa0}
  .pausebox .btn{margin-bottom:10px}
  .form:disabled{opacity:.5;cursor:not-allowed}
  #achModal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(8,10,18,.72);padding:16px;box-sizing:border-box}
  #achModal[hidden]{display:none}
  #achModal .panel{max-width:560px;max-height:calc(100vh - 32px);overflow:auto}
  #achModal h1{font-size:36px}
  .achbar{height:10px;background:#141821;border:1px solid #2f3a52;border-radius:5px;overflow:hidden;margin:6px 0 10px}
  .achbar i{display:block;height:100%;background:linear-gradient(90deg,#e0aa3e,#ffd35c)}
  .achg{font-size:11px;letter-spacing:.12em;color:#8f9ab2;font-weight:700;margin:14px 0 6px}
  .achrow{display:flex;align-items:center;gap:10px;background:#232b3d;border:1px solid #2f3a52;border-radius:6px;padding:9px 11px;margin:0 0 6px}
  .achrow.done{border-color:#c9a45c;background:#2e2a26}
  .achic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#141821;border:2px solid #3a4560;font-family:"Black Han Sans",sans-serif;color:#5a6580;font-size:15px}
  .achrow.done .achic{background:#e0aa3e;border-color:#fff1c4;color:#1f2230}
  .achtx{flex:1;min-width:0}
  .achtx b{display:block;color:#fff;font-size:14px}
  .achtx span{font-size:12px;color:#9aa4ba;line-height:1.4}
  .achrw{flex:none;font-size:12px;font-weight:700;color:#ffd35c;background:#141821;border-radius:12px;padding:4px 9px;white-space:nowrap}
  .achrow:not(.done) .achrw{color:#8f9ab2}
  @media (max-width:860px){
    .t-head{left:14px;top:10px} .t-head h1{font-size:34px} .t-tabs{left:14px;top:62px} .tab{font-size:15px;padding:5px 10px 6px}
    .t-side{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:50vh;padding:14px}
    .t-side .keys,.t-side small{display:none}
  }
</style>
</head>
<body>


<div id="wrap"><canvas id="game"></canvas></div>
<div id="ui"><div class="panel" id="panel"></div></div>
<div id="achModal" hidden><div class="panel" id="achPanel"></div></div>
<div id="title" hidden>
  <canvas id="mapc"></canvas>
  <div class="t-head"><div class="eyebrow" id="teyebrow"></div><h1>쌈@뽕 검사</h1></div>
  <div class="t-tabs" id="ttabs"></div>
  <aside class="panel t-side" id="tside"></aside>
</div>

<script>
(() => {
const W = 1280, H = 720;
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
const ui = document.getElementById('ui'), panel = document.getElementById('panel');
let scale = 1, dpr = Math.min(window.devicePixelRatio || 1, 2);

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Array.isArray(r) ? r[0] : r; r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * scale + 'px'; cv.style.height = H * scale + 'px';
  cv.width = Math.round(W * scale * dpr); cv.height = Math.round(H * scale * dpr);
}
addEventListener('resize', resize); resize();

// ---------- utils ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const FONT = '"Black Han Sans","Noto Sans KR",sans-serif';
const PI = Math.PI;
const now = () => performance.now() / 1000;

const OL = '#1f2230';
let curOL = OL;
const LW = 3;
function P(fill, lw = LW) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = curOL; ctx.stroke(); }
function limb(pts, w, col) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.strokeStyle = curOL; ctx.lineWidth = w + LW * 2; ctx.stroke();
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, PI * 2); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); }
function outlinedText(txt, x, y, size, fill, ol = OL, lw = 6, align = 'center') {
  ctx.font = `${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; if (lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = ol; ctx.strokeText(txt, x, y); }
  ctx.fillStyle = fill; ctx.fillText(txt, x, y);
}

// ---------- audio ----------
let AC = null, muted = false, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function noise(dur, freq, gain, q = 1) {
  const t = AC.currentTime, s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  const g = AC.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f).connect(g).connect(AC.destination); s.start(t); s.stop(t + dur);
}
function tone(f1, f2, dur, gain, type = 'sine') {
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur);
}
function sfx(k) {
  if (!AC || muted) return;
  try {
    if (k === 'swing') noise(0.12, 3000, 0.12, 0.8);
    else if (k === 'hit') { tone(200, 60, 0.12, 0.25); noise(0.07, 1200, 0.2); }
    else if (k === 'crit') { tone(320, 80, 0.16, 0.3, 'triangle'); noise(0.1, 1800, 0.25); }
    else if (k === 'hurt') { tone(160, 70, 0.2, 0.25, 'square'); }
    else if (k === 'skill') { noise(0.3, 900, 0.18, 0.6); tone(300, 900, 0.25, 0.08, 'sawtooth'); }
    else if (k === 'boom') { tone(120, 30, 0.5, 0.4); noise(0.4, 400, 0.35, 0.5); }
    else if (k === 'shot') { tone(900, 300, 0.12, 0.07, 'square'); }
    else if (k === 'zap') { noise(0.18, 4000, 0.2, 2); tone(1400, 200, 0.15, 0.08, 'sawtooth'); }
    else if (k === 'magic') { tone(500, 1200, 0.15, 0.08, 'triangle'); }
    else if (k === 'warn') { tone(440, 440, 0.25, 0.08, 'square'); }
    else if (k === 'pick') { tone(600, 1200, 0.15, 0.12, 'triangle'); }
    else if (k === 'lvl') { tone(440, 880, 0.3, 0.12, 'triangle'); setTimeout(() => tone(660, 1320, 0.3, 0.1, 'triangle'), 120); }
  } catch (e) {}
}

// ---------- music (procedural, WebAudio) ----------
const TRACKS = {
  field: { name: '던전', bpm: 92, chords: ['Dm', 'Bb', 'Gm', 'A', 'Dm', 'Bb', 'Gm', 'A'],
    pad: { type: 'violinPad', vol: 0.03 },
    bass: { wave: 'pianoBass', pat: 'R . . . . . . . R . . . 5 . . .', vol: 0.1 },
    arp: { pat: '0 . . 2 . . 1 . . 2 . . 3 . . .', vol: 0.04, wave: 'piano', oct: 4 },
    lead: { wave: 'violin', vol: 0.05, echo: 0, notes: [
      'A4 - - - F4 - - - E4 - D4 - - - - -', 'D4 - - - F4 - - - Bb4 - - - A4 - - -',
      'G4 - - - - - Bb4 - A4 - G4 - F4 - - -', 'E4 - - - - - - - C#5 - - - - - - -',
      'A4 - - - D5 - - - C5 - Bb4 - A4 - - -', 'F4 - - - - - D4 - F4 - Bb4 - - - - -',
      'G4 - A4 - Bb4 - - - A4 - G4 - F4 - E4 -', 'D4 - - - - - - - . . . . . . . .'] },
    drums: { T: 'x.......x.......', vol: 0.4 } },
  // 보스 음악은 아래 FILE_TRACKS 에 보스별로 추가 (없는 보스는 필드음 유지)
};
// 배경음악 전체 볼륨 (0 ~ 1)
const MUSIC_VOL = 0.55;
// 음악 파일로 재생할 곡. 앞에서부터 차례로 시도하고, 모두 실패하면 코드로 만든 곡을 재생해요.
// void.mp3 를 index.html 과 같은 곳(GitHub 저장소)에 올리면 그 파일이 재생돼요.
// 예: kairos: { vol: 0.6, src: ['void.mp3'] }
const FILE_TRACKS = {};
const MUSIC = (() => {
  const NN = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const midi = s => { const m = /^([A-G])([#b]?)(-?\d)$/.exec(s); if (!m) throw new Error('bad note ' + s); return 12 * (+m[3] + 1) + NN[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); };
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const chordNotes = (name, oct) => { const m = /^([A-G][#b]?)(m?)$/.exec(name); const r = midi(m[1] + oct); return [r, r + (m[2] ? 3 : 4), r + 7]; };
  function parseLine(str) {
    const toks = str.trim().split(/\s+/), ev = new Array(toks.length).fill(null); let last = -1;
    toks.forEach((t, i) => { if (t === '-') { if (last >= 0) ev[last].d++; } else if (t === '.') last = -1; else { ev[i] = { m: midi(t), d: 1 }; last = i; } });
    return ev;
  }
  // ---- 곡 구성기: 구간별로 한 마디씩 연주 계획(plan)을 만들어요 ----
  const SCALES = { minor: [0, 2, 3, 5, 7, 8, 10], harm: [0, 2, 3, 5, 7, 8, 11], phryd: [0, 1, 4, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
  const RHY = {
    fast: ['x-x-x-x-xxx-x---', 'x---x-x-x-x-x---', 'x-xxx-x-x---x-x-', 'x---x---x-x-xxxx', 'x-x-x---x-xxx---'],
    mid: ['x---x---x-x-x---', 'x-----x-x---x---', 'x---x-x-x-------', 'x-x-x---x---x---'],
    slow: ['x-------x-------', 'x-----x-x-------', 'x---x---x-------', 'x-------x---x---'],
  };
  const rngOf = seed => { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
  const pc = m => ((m % 12) + 12) % 12;
  const scaleSet = (key, sc) => { const r = pc(midi(key + '4')); return new Set(SCALES[sc].map(x => (x + r) % 12)); };
  const snap = (m, set) => { for (let d = 0; d < 6; d++) { if (set.has(pc(m + d))) return m + d; if (set.has(pc(m - d))) return m - d; } return m; };
  const stepScale = (m, dir, set) => { let x = m + dir; while (!set.has(pc(x))) x += dir; return x; };
  const tonesIn = (name, lo, hi) => { const pcs = chordNotes(name, 3).map(pc), out = []; for (let m = lo; m <= hi; m++) if (pcs.includes(pc(m))) out.push(m); return out; };
  const nearest = (arr, m) => arr.reduce((a, b) => Math.abs(b - m) < Math.abs(a - m) ? b : a);
  const emptyBar = () => new Array(16).fill(null);
  const shiftBar = (ev, n) => ev.map(e => e ? { m: e.m + n, d: e.d } : null);
  function genBars(chords, o) {
    const bars = [], rh = [], src = []; let prev = Math.round((o.lo + o.hi) / 2);

  sparkFx(e.x + rnd(-8, 8), e.y - e.z - (e.T.hh ? e.T.hh * 0.45 : 38 * e.s) + rnd(-10, 10), crit ? 1.3 : 1, hero.form === 'void' ? '#d8a8ff' : hero.form === 'dusk' ? '#ffc890' : o.col);

    desc: '이그니스와 네뷸론, 마지막엔 체력을 공유하는 작은 네뷸론 2마리 네뷸론 트윈즈가 기다립니다.', gate: { fire: '#ffb43a', glow: '255,180,80', in1: '#3a220a', in2: '#160c04', stone: '#6a5a50', sign: '좀 치네?' } },
  { id: 'adv', name: '상급 던전', bosses: ['gorgros', 'ghostTitan', 'cloneGorgros'], reward: { lvl: 5 },
    desc: '황혼의 세계 보스들이 나오는 던전. 마지막엔 분신을 불러내는 클론 고르그로스가 기다립니다.', gate: { fire: '#ff4a4a', glow: '255,80,80', in1: '#3a0a0a', in2: '#140404', stone: '#4a3a46', sign: '상급' } },
  { id: 'void', name: '공허의 던전', bosses: ['inferno', 'nebulon', 'twinKairos'], reward: { voidForm: true },
    desc: '공허에 물든 강적들의 던전. 마지막엔 체력을 공유하는 트윈 카이로스가 기다립니다.' },
];
const DG_NODES = [[230, 620], [560, 620], [890, 620], [1290, 560]];
const DG_DAILY = 2;
function dgToday() {
  const d = new Date(), k = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  if (!save.dgDay || save.dgDay.d !== k) save.dgDay = { d: k, c: {} };
  return save.dgDay;
}
const dgLeft = id => Math.max(0, DG_DAILY - (dgToday().c[id] || 0));
let pickDg = 0;
function dungeonOpen() { return TEST_MODE || !!save.twilight; }
const BOSS_HOME = { twinKairos: 'kairos', nebTwins: 'nebulon', cloneGorgros: 'gorgros' };
const bossSi = k => STAGES.findIndex(S => S.boss === (BOSS_HOME[k] || k));
function dgStage() { const D = G.dg.D, k = D.bosses[G.dg.step]; return { name: D.name, zones: ['', '', `BOSS ${G.dg.step + 1} · ${MOBS[k].name}`], theme: STAGES[bossSi(k)].theme, boss: k }; }
function dgQueue(step, delay) {
  const k = G.dg.D.bosses[step]; G.dg.step = step; G.dg.drop = false; G.si = bossSi(k);
  if (k === 'twinKairos' || k === 'nebTwins') spawnQueue.push({ t: delay, fn: () => spawnTwins(k) });
  else spawnQueue.push({ t: delay, kind: k, x: ZX[G.cz] + 950, y: 548 });
  G.gorMul = k === 'cloneGorgros' ? 1.35 : 1;
}
function startDungeon(di, cls, lvl, exp) {
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  const D = DUNGEONS[di];
  newGame(bossSi(D.bosses[0]), cls, lvl, exp); G.dg = { i: di, D, step: 0, next: 0, drop: false }; G.hintT = 0;
  G.state = 'play'; ui.hidden = true; titleEl.hidden = true; paused = false;
  joy.id = null; joy.dx = joy.dy = 0; touchAtk.id = null;
  G.cz = 2; hero.x = ZX[2] + 260; camX = ZX[2];
  MUSIC.play('field', FIELD_KEY[G.si] || 0);
  banners.push({ text: D.name, sub: `DUNGEON · 보스 ${D.bosses.length}연전`, t: 0, dur: 2.2, boss: false });
  dgQueue(0, 2.4);
}
function dgBossDown() {
  const D = G.dg.D;
  if (G.dg.step >= D.bosses.length - 1) {
    G.state = 'win'; G.winT = 2.8; MUSIC.stop(0.4); MUSIC.jingle('win');
    banners.push({ text: 'DUNGEON CLEAR', sub: D.name, t: 0, dur: 2.8, boss: true });
  } else {
    G.dg.next = 4.2;
    banners.push({ text: '보스 격파!', sub: `포션을 챙기세요 · 다음 보스 ${MOBS[D.bosses[G.dg.step + 1]].name}`, t: 0, dur: 2.6, boss: false });
  }
}
function dgSwap() {
  enemies = enemies.filter(e => e.state !== 'dead'); eproj = []; G.haz = G.haz.filter(h => h.hero); G.dark = 0; G.erupt = 0; G.wall = null; G.under = false;
  hero.x = ZX[G.cz] + 260; hero.y = 548; hero.dest = null; hero.target = null; camX = ZX[G.cz];
  potions = potions.filter(p => !p.got).map(p => ({ ...p, x: ZX[G.cz] + 420 + (p.x % 2 ? 40 : -10), t: Math.min(p.t, 5) }));
  dgQueue(G.dg.step + 1, 1.0); G.cleared = false;
  MUSIC.play('field', FIELD_KEY[G.si] || 0);
  banners.push({ text: ST().name, sub: `BOSS ${G.dg.step + 1} / ${G.dg.D.bosses.length}`, t: 0, dur: 1.6, boss: false });
}
function giveLevels(cls, n) {
  const C = CLASSES[cls];
  if (hero && hero.cls === cls) { for (let i = 0; i < n; i++) { hero.lvl++; hero.maxHp += C.hpL; hero.maxMp += C.mpL; } hero.hp = hero.maxHp; hero.mp = hero.maxMp; }
}
function showDungeonClear() {
  const D = G.dg.D, cls = G.cls;
  save = loadSave();
  const first = !(save.dg[D.id] && save.dg[D.id][cls]);
  (save.dg[D.id] = save.dg[D.id] || {})[cls] = Date.now();
  const day = dgToday(); day.c[D.id] = (day.c[D.id] || 0) + 1;
  let msg = '';
  if (D.reward.lvl) {
    if (first) { giveLevels(cls, D.reward.lvl); msg = `<p class="unlock">★ 첫 클리어 보상 · <b>${CLASSES[cls].name} 레벨 +${D.reward.lvl}</b></p>`; }
    else msg = `<p>첫 클리어 보상은 이미 받았어요. 보스를 잡아 얻은 경험치는 그대로 쌓였어요.</p>`;
  }
  let newVoid = false;
  if (D.reward.voidForm) {
    if (!save.voidForm[cls]) { save.voidForm[cls] = true; newVoid = true; }
    msg = newVoid ? `<p class="unlock">★ 진화 해금 · <b>${VOID_NAMES[cls]}</b> — 지도 화면 '형태'에서 바꿀 수 있어요.</p>` : `<p>${VOID_NAMES[cls]}는 이미 해금되어 있어요.</p>`;
  }
  save[cls].lvl = hero.lvl; save[cls].exp = hero.exp; save.cls = cls;
  writeSave(save);
  if (save.voidForm.sword && save.voidForm.mage && save.voidForm.archer) grantAch('voidMaster');
  panel.innerHTML = `
    <div class="eyebrow">DUNGEON CLEAR · ${D.name}</div>
    <h1>던전 클리어!</h1>
    <p>보스 ${D.bosses.length}마리를 모두 쓰러뜨렸습니다. 현재 레벨 Lv.${hero.lvl}이 저장됐어요.</p>
    ${msg}
    <p>오늘 이 던전 클리어 <b>${DG_DAILY - dgLeft(D.id)} / ${DG_DAILY}</b>회${dgLeft(D.id) ? '' : ' · 내일 다시 도전할 수 있어요'}</p>
    ${newAchHTML()}
    <div class="stats"><div><b>${fmtTime(G.time)}</b>클리어 시간</div><div><b>${G.maxCombo}</b>최대 콤보</div><div><b>${G.dmgTaken.toLocaleString()}</b>받은 피해</div></div>
    <div class="row"><button class="btn" id="go" ${dgLeft(D.id) ? '' : 'disabled'}>${dgLeft(D.id) ? '다시 도전' : '오늘 횟수 끝'}</button><button class="btn ghost" id="home">던전 목록</button></div>`;
  ui.hidden = false;
  const di = G.dg.i;
  document.getElementById('go').onclick = () => { if (!dgLeft(D.id)) return; const sv = loadSave()[cls]; startDungeon(di, cls, sv.lvl, sv.exp); };
  document.getElementById('home').onclick = () => showTitle(2);
}
// ---------- pause (일시정지 · PC는 ESC) ----------
const PB = { x: W - 152, y: 12, s: 40 };
function drawPauseBtn() {
  if (G.state !== 'play') return;
  ctx.beginPath(); ctx.roundRect(PB.x, PB.y, PB.s, PB.s, 8); ctx.fillStyle = 'rgba(20,25,36,.82)'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#c9a45c'; ctx.stroke();
  ctx.fillStyle = '#ffffff'; ctx.fillRect(PB.x + 13, PB.y + 11, 5, 18); ctx.fillRect(PB.x + 22, PB.y + 11, 5, 18);
  if (!touchMode) { ctx.font = `11px "Noto Sans KR",sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#9aa4ba'; ctx.fillText('ESC', PB.x + PB.s / 2, PB.y + PB.s + 13); }
}
function inPauseBtn(p) { return p.x >= PB.x - 6 && p.x <= PB.x + PB.s + 6 && p.y >= PB.y - 6 && p.y <= PB.y + PB.s + 6; }
function setPause(v) {
  if (v && (G.state !== 'play' || !titleEl.hidden)) return;
  paused = v; mouse.rDown = false; joy.id = null; joy.dx = joy.dy = 0; touchAtk.id = null;
  if (v) {
    try { if (AC && AC.state === 'running') AC.suspend(); } catch (_) {}
    const where = G.dg ? `${G.dg.D.name} · BOSS ${G.dg.step + 1} / ${G.dg.D.bosses.length}` : `STAGE ${stageNo(G.si)} · ${ST().name}`;
    panel.innerHTML = `<div class="pausebox">
      <div class="eyebrow">PAUSED · ${where}</div>
      <h1>일시정지</h1>
      <p>게임이 멈췄어요. ${touchMode ? '' : 'ESC를 다시 누르면 이어서 해요.'}</p>
      <button class="btn" id="presume">계속하기</button>
      <button class="btn ghost" id="pexit" style="width:100%">나가기</button>
      <small>나가면 이번 판의 진행은 저장되지 않아요.</small></div>`;
    ui.hidden = false;
    document.getElementById('presume').onclick = () => setPause(false);
    document.getElementById('pexit').onclick = () => { const ch = G.dg ? 2 : G.si >= CH1_COUNT ? 1 : 0; setPause(false); showTitle(ch); };
  } else {
    try { if (AC && AC.state === 'suspended') AC.resume(); } catch (_) {}
    ui.hidden = true; panel.innerHTML = '';
  }
}
addEventListener('keydown', e => { if (e.code === 'Escape' && titleEl.hidden && (G.state === 'play')) { e.preventDefault(); setPause(!paused); } });
document.addEventListener('visibilitychange', () => { if (document.hidden && titleEl.hidden && G.state === 'play' && !paused) setPause(true); });

// ---------- loop ----------
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.033, (t - last) / 1000); last = t;
  try { if (!paused) update(dt); if (titleEl.hidden) render(); else drawMap(); }
  catch (err) { console.error(err); try { ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; curOL = OL; } catch (_) {} }
  requestAnimationFrame(frame);
}
showTitle();
(document.fonts && document.fonts.load ? Promise.all([document.fonts.load(`40px "Black Han Sans"`), document.fonts.load(`14px "Noto Sans KR"`)]).catch(() => {}) : Promise.resolve())
  .finally(() => requestAnimationFrame(frame));
})();
</script>
